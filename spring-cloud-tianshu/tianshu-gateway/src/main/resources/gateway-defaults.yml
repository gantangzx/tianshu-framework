# 网关开箱即用默认值。业务配置可覆盖。
server:
  port: 9000

spring:
  application:
    name: tianshu-gateway
  cloud:
    gateway:
      discovery:
        locator:
          # 允许按服务名转发：/{service-name}/**
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# swagger-ui webjar 默认配置：UI 直接使用网关聚合的 OpenAPI
springdoc:
  swagger-ui:
    url: /v3/api-docs
    path: /swagger-ui.html
    use-root-path: true
