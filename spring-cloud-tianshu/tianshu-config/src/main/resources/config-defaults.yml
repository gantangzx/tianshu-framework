# Nacos 配置中心开箱即用默认值（基于官方 nacos-client，不依赖 SCA starter）。业务配置可覆盖。
# 默认拉取 dataId = ${spring.application.name}.${file-extension}，缺失不阻断启动。
tianshu:
  nacos:
    config:
      enabled: true
      # 地址留空则回退到 tianshu.nacos.server-addr；也可用环境变量 NACOS_SERVER_ADDR 覆盖
      server-addr: ${NACOS_CONFIG_SERVER_ADDR:}
      namespace: ${NACOS_CONFIG_NAMESPACE:}
      group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
      file-extension: yml
      # 动态刷新默认开启，配合 @RefreshScope / @ConfigurationProperties 生效
      refresh-enabled: true
      timeout-ms: 5000
      fail-fast: false
      shared-configs: []
